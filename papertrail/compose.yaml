name: papertrail

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    expose:
      - "8080"
    environment:
      APP_NAME: ${APP_NAME:-PaperTrail}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-https://papertrail-to.online}
      APP_CONFIG_CACHE: ${APP_CONFIG_CACHE:-true}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_DEPRECATIONS_CHANNEL: ${LOG_DEPRECATIONS_CHANNEL:-null}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-database}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-papertrail}
      DB_USERNAME: ${DB_USERNAME:-papertrail}
      DB_PASSWORD: ${DB_PASSWORD}
      BROADCAST_DRIVER: ${BROADCAST_DRIVER:-null}
      CACHE_DRIVER: ${CACHE_DRIVER:-file}
      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-sync}
      SESSION_DRIVER: ${SESSION_DRIVER:-file}
      SESSION_LIFETIME: ${SESSION_LIFETIME:-30}
      SESSION_DOMAIN: ${SESSION_DOMAIN:-.papertrail-to.online}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-^papertrail-to\.online$,^www\.papertrail-to\.online$}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://papertrail-to.online,https://www.papertrail-to.online}
      CORS_SUPPORTS_CREDENTIALS: ${CORS_SUPPORTS_CREDENTIALS:-false}
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@papertrail-to.online}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-PaperTrail}
      PAPERTRAIL_EMAIL_NOTIFICATIONS: ${PAPERTRAIL_EMAIL_NOTIFICATIONS:-true}
      PAPERTRAIL_ATTACHMENT_MAX_SIZE_KB: ${PAPERTRAIL_ATTACHMENT_MAX_SIZE_KB:-10240}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_ORGANIZATION: ${OPENAI_ORGANIZATION}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_REQUEST_TIMEOUT: ${OPENAI_REQUEST_TIMEOUT:-30}
      PAPERTRAIL_AI_SUMMARY_CACHE_SECONDS: ${PAPERTRAIL_AI_SUMMARY_CACHE_SECONDS:-300}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_BUCKET: ${AWS_BUCKET}
      AWS_USE_PATH_STYLE_ENDPOINT: ${AWS_USE_PATH_STYLE_ENDPOINT:-false}
      PUSHER_APP_ID: ${PUSHER_APP_ID}
      PUSHER_APP_KEY: ${PUSHER_APP_KEY}
      PUSHER_APP_SECRET: ${PUSHER_APP_SECRET}
      PUSHER_HOST: ${PUSHER_HOST}
      PUSHER_PORT: ${PUSHER_PORT:-443}
      PUSHER_SCHEME: ${PUSHER_SCHEME:-https}
      PUSHER_APP_CLUSTER: ${PUSHER_APP_CLUSTER:-mt1}
      VITE_APP_NAME: ${VITE_APP_NAME:-PaperTrail}
      VITE_PUSHER_APP_KEY: ${VITE_PUSHER_APP_KEY}
      VITE_PUSHER_HOST: ${VITE_PUSHER_HOST}
      VITE_PUSHER_PORT: ${VITE_PUSHER_PORT:-443}
      VITE_PUSHER_SCHEME: ${VITE_PUSHER_SCHEME:-https}
      VITE_PUSHER_APP_CLUSTER: ${VITE_PUSHER_APP_CLUSTER:-mt1}
    volumes:
      - papertrail_storage:/var/www/html/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'Host: papertrail-to.online' http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  database:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-papertrail}
      MYSQL_USER: ${DB_USERNAME:-papertrail}
      MYSQL_PASSWORD: ${DB_PASSWORD:-CHANGE_ME}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-CHANGE_ME_ROOT}
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - papertrail_database:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  papertrail_storage:
  papertrail_database:
